apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: daeng-map-prod-be
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/20-team-daeng-ddang-cloud.git
    targetRevision: main
    path: helm/backend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true