nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: daengmap/daeng-map-backend
  tag: k8s_test
  pullPolicy: Always

serviceAccount:
  name: backend-sa

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1500m"
    memory: "2Gi"

env:
  SPRING_PROFILES_ACTIVE: dev

configMapRefName: backend-config
secretRefName: backend-secret

readinessProbe:
  enabled: true
  path: /api/v3/health
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  enabled: true
  path: /api/v3/health
  initialDelaySeconds: 40
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

