grafana:
  enabled: false

alertmanager:
  enabled: false

kubeEtcd:
  enabled: false

prometheus:
  service:
    type: ClusterIP

  prometheusSpec:
    retention: 3d
    scrapeInterval: 15s

    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

defaultRules:
  create: true
