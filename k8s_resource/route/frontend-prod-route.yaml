# frontend-prod-route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: prod
spec:
  parentRefs:
  - name: main-gateway
    sectionName: prod-http
  - name: main-gateway
    sectionName: prod-https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
      - name: daeng-map-fe-frontend
        port: 3000
