# frontend-prod-route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: dev
spec:
  parentRefs:
    - name: main-gateway
      namespace: infra
      sectionName: dev-http
    - name: main-gateway
      namespace: infra
      sectionName: dev-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: daeng-map-dev-fe-frontend
          port: 3000
