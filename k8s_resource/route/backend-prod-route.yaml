# backend-prod-route.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: prod
spec:
  parentRefs:
  - name: main-gateway
    namespace: infra
    sectionName: prod-http
  - name: main-gateway
    namespace: infra
    sectionName: prod-https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: PathPrefix
        value: /ws
    backendRefs:
      - name: daeng-map-be-backend
        port: 8080
    
